name: Notifiche Scadenze Giornaliere

on:
  schedule:
    - cron: '0 22 * * *' # Mezzanotte Italiana (00:00)
  workflow_dispatch:

jobs:
  invia-notifiche:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Prepara Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installa pacchetti
        run: npm install

      - name: Lancia controllo scadenze
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-notifications.js
